<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Local AI Hub</title>
<style>
  :root { --fg: #1a1a1a; --muted: #666; --line: #ddd; --bg: #fcfcfc; --code: #f4f4f4; --ok: #1a6b2f; --warn: #8a5a00; --bad: #8b1a1a; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.45 -apple-system, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); }
  header { display: flex; align-items: baseline; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); }
  header .spacer { flex: 1; }
  button { font: inherit; padding: 2px 10px; border: 1px solid var(--line); background: #fff; border-radius: 3px; cursor: pointer; }
  button:disabled { color: #aaa; cursor: default; }
  button.primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  main { display: grid; grid-template-columns: 340px 1fr; height: calc(100vh - 42px); }
  #left { border-right: 1px solid var(--line); overflow-y: auto; padding: 12px 16px; }
  #right { display: flex; flex-direction: column; min-width: 0; }
  #models { overflow-y: auto; max-height: 45vh; padding: 12px 16px; border-top: 1px solid var(--line); }
  section { margin-bottom: 18px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 6px; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 2px 6px 2px 0; vertical-align: top; }
  td.k { color: var(--muted); white-space: nowrap; width: 90px; }
  .tag { display: inline-block; font-size: 11px; padding: 0 6px; border: 1px solid var(--line); border-radius: 3px; color: var(--muted); }
  .tag.ok { color: var(--ok); border-color: var(--ok); }
  .tag.warn { color: var(--warn); border-color: var(--warn); }
  .tag.bad { color: var(--bad); border-color: var(--bad); }
  .model { border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; margin-bottom: 8px; }
  .model.active { border-color: #1a1a1a; }
  .model .row1 { display: flex; gap: 8px; align-items: baseline; }
  .model .name { font-weight: 600; }
  .model .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .model .actions { display: flex; gap: 6px; margin-top: 6px; }
  #status { padding: 6px 16px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; min-height: 26px; }
  #status.err { color: var(--bad); }
  #harness { flex: 1; display: flex; }
  #harness webview { flex: 1; border: 0; width: 100%; }
  #harness-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .bar { padding: 6px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
  code { background: var(--code); padding: 0 4px; border-radius: 3px; font-size: 12px; }
  .muted { color: var(--muted); }
  input[type=text] { font: inherit; padding: 2px 6px; border: 1px solid var(--line); border-radius: 3px; width: 220px; }
</style>
</head>
<body>
<header>
  <h1>Local AI Hub</h1>
  <span class="sub" id="hostline"></span>
  <span class="spacer"></span>
  <button id="btn-sync">Sync registry</button>
</header>
<main>
  <div id="left">
    <section>
      <h2>This machine</h2>
      <table id="stats"></table>
    </section>
    <section>
      <h2>Running</h2>
      <table id="running"></table>
    </section>
    <section>
      <h2>Registry</h2>
      <table id="reginfo"></table>
    </section>
  </div>
  <div id="right">
    <div id="status"></div>
    <div class="bar">
      <span class="muted">Harness folder</span>
      <input type="text" id="dsh-cwd">
      <button id="btn-dsh" class="primary">Open DeepSeek harness</button>
      <button id="btn-stop-dsh">Stop harness</button>
      <span id="dsh-state" class="muted"></span>
    </div>
    <div id="harness"><div id="harness-empty">Load a model, then open the harness here.</div></div>
    <div id="models"></div>
  </div>
</main>
<script src="ui.js"></script>
</body>
</html>
